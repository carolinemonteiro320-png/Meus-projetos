<body>
    <p class="nome">Lucia</p>

    <img class="personagem" src="lucia.png">

    <div class="textos">

        <p class="Escolher">Escolha uma lenda de Dev City. Ou tire uma selfie e vire uma</p>

    </div>

    <div class="menu">

        <img onclick="escolherpersonagem('Lucia', 'lucia.png', '#ff3cac')" class="avatar" src="lucia.png">

        <img onclick="escolherpersonagem('Jason', 'jason.png', '#00b2c9')" class="avatar" src="jason.png">

        <img onclick="escolherpersonagem('CJ', 'cj.png', '#7ed37e')" class="avatar" src="cj.png">

    </div>
